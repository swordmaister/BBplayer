<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Babylon WebXR Pure Viewer</title>
    <style>
        /* UIの誤作動防止用リセット */
        * {
            -webkit-touch-callout: none; -webkit-user-select: none;
            -moz-user-select: none; -ms-user-select: none; user-select: none;
            outline: none; -webkit-tap-highlight-color: transparent;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* 🌟 純粋なビューワーとしてのiframe */
        #viewer { width: 100%; height: 100%; border: none; display: block; }
        
        #loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        #loading.active { opacity: 1; pointer-events: auto; }
        #loading h2 { margin: 0 0 10px 0; }

        #header-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .panel { background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 8px; color: white; border: 1px solid #555; backdrop-filter: blur(4px); display:flex; gap:10px; align-items:center; pointer-events: auto; max-width: 65%; }
        #filename-display { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
        .btn { background: #333; color: white; border: 1px solid #666; padding: 8px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .btn:active { background: #555; }

        #move-ui { position: absolute; bottom: 20px; left: 20px; z-index: 10; display: grid; grid-template-columns: 50px 50px 50px; grid-gap: 5px; pointer-events: none; }
        #move-ui .space { visibility: hidden; }
        #move-ui-updown { position: absolute; bottom: 20px; right: 20px; z-index: 10; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
        .dpad-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; color: white; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: 18px; touch-action: none; cursor: pointer; pointer-events: auto; }
        .dpad-btn:active { background: rgba(255,255,255,0.6); }

        #settings-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,20,0.95); border: 1px solid #777; border-radius: 10px; padding: 20px; z-index: 50; color: white; display: none; width: 300px; max-width: 80%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto; }
        #settings-modal.active { display: block; }
        .setting-row { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        select { background: #333; color: white; border: 1px solid #666; padding: 5px; border-radius: 4px; max-width: 150px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loading">
        <h2>読込中...</h2>
        <div id="loading-text">APIと通信しています</div>
    </div>

    <div id="header-ui">
        <div class="panel">
            <button class="btn" onclick="toggleSettings()">⚙️ 設定</button>
            <div id="filename-display">World: リスト取得中...</div>
        </div>
        <div class="panel">
            <button class="btn" onclick="prevWorld()">◀ 前へ</button>
            <button class="btn" onclick="nextWorld()">次へ ▶</button>
        </div>
    </div>

    <div id="move-ui">
        <div class="space"></div><div class="dpad-btn" onpointerdown="startMove('w')" onpointerup="stopMove()" onpointerout="stopMove()">W</div><div class="space"></div>
        <div class="dpad-btn" onpointerdown="startMove('a')" onpointerup="stopMove()" onpointerout="stopMove()">A</div>
        <div class="dpad-btn" onpointerdown="startMove('s')" onpointerup="stopMove()" onpointerout="stopMove()">S</div>
        <div class="dpad-btn" onpointerdown="startMove('d')" onpointerup="stopMove()" onpointerout="stopMove()">D</div>
    </div>
    
    <div id="move-ui-updown">
        <div class="dpad-btn" onpointerdown="startMove('up')" onpointerup="stopMove()" onpointerout="stopMove()">▲</div>
        <div class="dpad-btn" onpointerdown="startMove('down')" onpointerup="stopMove()" onpointerout="stopMove()">▼</div>
    </div>

    <div id="settings-modal">
        <h3 style="margin-top:0; border-bottom:1px solid #555; padding-bottom:10px;">オプション</h3>
        <div class="setting-row">
            <label>ワールド選択:</label>
            <select id="fileSelect" onchange="loadWorldFromSelect()"></select>
        </div>
        <div class="setting-row">
            <label>自動切替:</label>
            <select id="auto-switch" onchange="updateAutoSwitch()">
                <option value="0">オフ</option><option value="5000">5秒</option>
                <option value="10000">10秒</option><option value="30000">30秒</option>
            </select>
        </div>
        <div class="setting-row">
            <label>移動UI表示:</label>
            <input type="checkbox" id="toggle-move-ui" checked onchange="toggleMoveUI()">
        </div>
        <div class="setting-row">
            <label>ソースコード:</label>
            <button class="btn" id="copy-html-btn" onclick="copyCurrentHtml()" style="background: #0984e3;">HTMLをコピー</button>
        </div>
        <div style="text-align: right; margin-top: 20px;">
            <button class="btn" onclick="toggleSettings()" style="background: #ff4757;">閉じる</button>
        </div>
    </div>

    <iframe id="viewer" allow="xr-spatial-tracking"></iframe>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycby6LBjdiOqDbtgmoQZAybLDQN-B-F9188sF5DkJE5ecdX9ydRiqSZHFLSGQ1DGPnSh7/exec";
        
        let playlist = [], currentIndex = -1, autoSwitchTimer = null;
        let currentHtmlContent = "";
        let moveState = null;

        // ---------------------------------------------------------
        // 🌟 D-PADの信号をiframe内に送り込む処理
        // ---------------------------------------------------------
        const injectionScript = `
        <script>
            window.addEventListener('message', (e) => {
                if (!window.BABYLON || !e.data || !e.data.move) return;
                try {
                    const engines = BABYLON.Engine.Instances;
                    if (engines.length === 0) return;
                    const scn = engines[0].scenes[0];
                    if (!scn || !scn.activeCamera) return;
                    
                    const cam = scn.activeCamera;
                    const move = e.data.move;
                    const speed = 0.3;
                    
                    // ArcRotateCamera (対象を中心に回るカメラ) の場合
                    if (cam.getClassName().includes("ArcRotate")) {
                        const fwd = cam.getDirection(BABYLON.Vector3.Forward());
                        const right = cam.getDirection(BABYLON.Vector3.Right());
                        fwd.y = 0; right.y = 0; fwd.normalize(); right.normalize();
                        
                        if (move === 'w') cam.radius = Math.max(1, cam.radius - speed*2);
                        if (move === 's') cam.radius += speed*2;
                        if (move === 'a') cam.target.subtractInPlace(right.scale(speed));
                        if (move === 'd') cam.target.addInPlace(right.scale(speed));
                        if (move === 'up') cam.target.y += speed;
                        if (move === 'down') cam.target.y -= speed;
                    } 
                    // UniversalCamera (FPS視点のカメラ) の場合
                    else {
                        const fwd = cam.getDirection(BABYLON.Vector3.Forward());
                        const right = cam.getDirection(BABYLON.Vector3.Right());
                        fwd.y = 0; right.y = 0; fwd.normalize(); right.normalize();
                        
                        if (move === 'w') cam.position.addInPlace(fwd.scale(speed));
                        if (move === 's') cam.position.subtractInPlace(fwd.scale(speed));
                        if (move === 'a') cam.position.subtractInPlace(right.scale(speed));
                        if (move === 'd') cam.position.addInPlace(right.scale(speed));
                        if (move === 'up') cam.position.y += speed;
                        if (move === 'down') cam.position.y -= speed;
                    }
                } catch(err) {}
            });
        <\/script>
        </body>`;

        // ---------------------------------------------------------
        // 通信・読み込みロジック
        // ---------------------------------------------------------
        async function fetchPlaylist() {
            document.getElementById("loading-text").innerText = "リストを取得中...";
            const res = await fetch(`${GAS_API_URL}?action=list`);
            return await res.json();
        }

        function populateFileSelect() {
            const sel = document.getElementById("fileSelect");
            sel.innerHTML = "";
            playlist.forEach((f, i) => {
                const opt = document.createElement("option"); opt.value = i; opt.textContent = f.name; sel.appendChild(opt);
            });
        }

        async function loadWorld(index) {
            if (playlist.length === 0) return;
            if (index < 0) index = playlist.length - 1;
            if (index >= playlist.length) index = 0;
            
            currentIndex = index;
            document.getElementById("filename-display").innerText = `World: ${playlist[currentIndex].name}`;
            document.getElementById("fileSelect").value = currentIndex;
            document.getElementById("loading").classList.add("active");

            try {
                const res = await fetch(`${GAS_API_URL}?action=get&id=${playlist[currentIndex].id}`);
                const htmlText = await res.text();
                currentHtmlContent = htmlText;
                
                // 🌟 ここが極意：取得したHTMLに「D-PAD受信用の短いスクリプト」だけをこっそり混ぜて、iframeに流し込む
                const finalHtml = htmlText.replace('</body>', injectionScript);
                document.getElementById("viewer").srcdoc = finalHtml;
                
            } catch (e) { 
                console.error("Load Error:", e);
                document.getElementById("filename-display").innerText = `[エラー] ${e.message}`;
            } 
            finally {
                // iframeの描画時間を少し待ってからローディングを消す
                setTimeout(() => {
                    document.getElementById("loading").classList.remove("active");
                    resetAutoSwitch();
                }, 500);
            }
        }
        
        function copyCurrentHtml() {
            if (!currentHtmlContent) return;
            navigator.clipboard.writeText(currentHtmlContent).then(() => {
                const btn = document.getElementById("copy-html-btn");
                const originalText = btn.innerText;
                btn.innerText = "コピーしました！"; btn.style.background = "#00b894";
                setTimeout(() => { btn.innerText = originalText; btn.style.background = "#0984e3"; }, 2000);
            });
        }

        // ---------------------------------------------------------
        // D-PAD の連続入力ループ
        // ---------------------------------------------------------
        function startMove(dir) { moveState = dir; }
        function stopMove() { moveState = null; }
        
        function renderLoop() {
            if (moveState) {
                const iframe = document.getElementById('viewer');
                if (iframe && iframe.contentWindow) {
                    // iframe内のBabylonに移動命令を送る
                    iframe.contentWindow.postMessage({ move: moveState }, '*');
                }
            }
            requestAnimationFrame(renderLoop);
        }
        requestAnimationFrame(renderLoop);

        // ---------------------------------------------------------
        // UI操作
        // ---------------------------------------------------------
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if(key === 'w') moveState = 'w'; if(key === 'a') moveState = 'a';
            if(key === 's') moveState = 's'; if(key === 'd') moveState = 'd';
            if(e.key === 'ArrowUp') moveState = 'up'; if(e.key === 'ArrowDown') moveState = 'down';
        });
        window.addEventListener('keyup', () => { moveState = null; });

        function prevWorld() { loadWorld(currentIndex - 1); }
        function nextWorld() { loadWorld(currentIndex + 1); }
        function toggleSettings() { document.getElementById("settings-modal").classList.toggle("active"); }
        function loadWorldFromSelect() { loadWorld(parseInt(document.getElementById("fileSelect").value, 10)); }
        
        function toggleMoveUI() {
            const show = document.getElementById("toggle-move-ui").checked;
            document.getElementById("move-ui").style.display = show ? "grid" : "none";
            document.getElementById("move-ui-updown").style.display = show ? "flex" : "none";
        }
        function updateAutoSwitch() { resetAutoSwitch(); }
        function resetAutoSwitch() {
            if(autoSwitchTimer) clearInterval(autoSwitchTimer);
            const interval = parseInt(document.getElementById("auto-switch").value, 10);
            if(interval > 0) autoSwitchTimer = setInterval(() => { nextWorld(); }, interval);
        }

        // 起動処理
        document.getElementById("loading").classList.add("active");
        fetchPlaylist().then(list => {
            playlist = list;
            if(playlist.length > 0) { populateFileSelect(); loadWorld(0); } 
            else document.getElementById("loading").classList.remove("active");
        }).catch(e => {
            document.getElementById("loading-text").innerText = "通信エラー: " + e.message;
        });
    </script>
</body>
</html>
