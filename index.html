<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Babylon WebXR Advanced Viewer</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; }
        
        #loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        #loading.active { opacity: 1; pointer-events: auto; }
        #loading h2 { margin: 0 0 10px 0; }
        #loading-text { font-size: 14px; color: #ccc; }

        #header-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10; }
        .panel { background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 8px; color: white; border: 1px solid #555; backdrop-filter: blur(4px); display:flex; gap:10px; align-items:center;}
        .btn { background: #333; color: white; border: 1px solid #666; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .btn:active { background: #555; }

        /* スマホ用 移動UI (WASD + 上下) */
        #move-ui { position: absolute; bottom: 20px; left: 20px; z-index: 10; display: grid; grid-template-columns: 50px 50px 50px; grid-gap: 5px; }
        #move-ui .space { visibility: hidden; }
        #move-ui-updown { position: absolute; bottom: 20px; right: 20px; z-index: 10; display: flex; flex-direction: column; gap: 5px; }
        
        .dpad-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; color: white; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: 18px; touch-action: manipulation; cursor: pointer; }
        .dpad-btn:active { background: rgba(255,255,255,0.6); }

        /* 設定モーダル */
        #settings-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,20,0.95); border: 1px solid #777; border-radius: 10px; padding: 20px; z-index: 50; color: white; display: none; width: 300px; max-width: 80%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #settings-modal.active { display: block; }
        .setting-row { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        select { background: #333; color: white; border: 1px solid #666; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="loading">
        <h2>読込中...</h2>
        <div id="loading-text">APIと通信しています</div>
    </div>

    <div id="header-ui">
        <div class="panel">
            <button class="btn" onclick="toggleSettings()">⚙️ 設定</button>
            <div id="filename-display">World: リスト取得中...</div>
        </div>
        <div class="panel">
            <button class="btn" onclick="prevWorld()">◀ 前へ</button>
            <button class="btn" onclick="nextWorld()">次へ ▶</button>
        </div>
    </div>

    <div id="move-ui">
        <div class="space"></div>
        <div class="dpad-btn" onpointerdown="startMove('w')" onpointerup="stopMove()" onpointerleave="stopMove()">W</div>
        <div class="space"></div>
        <div class="dpad-btn" onpointerdown="startMove('a')" onpointerup="stopMove()" onpointerleave="stopMove()">A</div>
        <div class="dpad-btn" onpointerdown="startMove('s')" onpointerup="stopMove()" onpointerleave="stopMove()">S</div>
        <div class="dpad-btn" onpointerdown="startMove('d')" onpointerup="stopMove()" onpointerleave="stopMove()">D</div>
    </div>

    <div id="move-ui-updown">
        <div class="dpad-btn" onpointerdown="startMove('up')" onpointerup="stopMove()" onpointerleave="stopMove()">▲</div>
        <div class="dpad-btn" onpointerdown="startMove('down')" onpointerup="stopMove()" onpointerleave="stopMove()">▼</div>
    </div>

    <div id="settings-modal">
        <h3 style="margin-top:0; border-bottom:1px solid #555; padding-bottom:10px;">オプション</h3>
        <div class="setting-row">
            <label>自動切替:</label>
            <select id="auto-switch" onchange="updateAutoSwitch()">
                <option value="0">オフ</option>
                <option value="5000">5秒</option>
                <option value="10000">10秒</option>
                <option value="30000">30秒</option>
            </select>
        </div>
        <div class="setting-row">
            <label>移動UI表示:</label>
            <input type="checkbox" id="toggle-move-ui" checked onchange="toggleMoveUI()">
        </div>
        <div class="setting-row">
            <label>ファイル名表示:</label>
            <input type="checkbox" id="toggle-filename" checked onchange="toggleFilename()">
        </div>
        <div style="text-align: right; margin-top: 20px;">
            <button class="btn" onclick="toggleSettings()" style="background: #ff4757;">閉じる</button>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        // =========================================================
        // 🚀 設定: GAS APIサーバーのURL
        // =========================================================
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycby6LBjdiOqDbtgmoQZAybLDQN-B-F9188sF5DkJE5ecdX9ydRiqSZHFLSGQ1DGPnSh7/exec";
        
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        let currentScene = null, camera = null, xrHelper = null;
        let activeMeshes = [], activeLights = [], activeTemplates = [], currentAnimatables = [];
        let playlist = [], currentIndex = -1, autoSwitchTimer = null;
        
        let moveState = null;
        const MOVE_SPEED = 0.15;

        // ---------------------------------------------------------
        // 1. 基盤シーンとMeta Quest 2 (WebXR) の設定
        // ---------------------------------------------------------
        async function createBaseScene() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.5, 0.8, 0.9, 1);
            scene.collisionsEnabled = true;

            // PC/スマホ用カメラ（キャンバスに対するスワイプ・ドラッグで首振りが可能）
            camera = new BABYLON.UniversalCamera("UniversalCamera", new BABYLON.Vector3(0, 5, -20), scene);
            camera.setTarget(BABYLON.Vector3.Zero());
            camera.attachControl(canvas, true); 
            camera.checkCollisions = true;
            camera.ellipsoid = new BABYLON.Vector3(0.5, 1, 0.5);

            const baseGround = BABYLON.MeshBuilder.CreateGround("base-ground", {width: 500, height: 500}, scene);
            baseGround.checkCollisions = true;
            baseGround.isVisible = false; 

            // Meta Quest 2 用 WebXR 初期化
            try {
                xrHelper = await scene.createDefaultXRExperienceAsync({
                    floorMeshes: [baseGround]
                });
                xrHelper.baseExperience.featuresManager.enableFeature(BABYLON.WebXRFeatureName.MOVEMENT, "latest", {
                    xrInput: xrHelper.input,
                    movementSpeed: 0.1,
                    rotationSpeed: 0.05
                });
            } catch(e) { 
                console.warn("このデバイスはWebXR非対応です（通常モードで動作します）:", e); 
            }

            // アニメーションとUI移動のループ
            scene.onBeforeRenderObservable.add(() => {
                const time = performance.now() * 0.001;
                const dt = engine.getDeltaTime() * 0.001;

                currentAnimatables.forEach(item => {
                    const a = item.anim, m = item.mesh, axis = a.axis || 'y', speed = a.speed || 1;
                    if(!m || m.isDisposed()) return;
                    
                    if (a.type === 'rotate') m.rotation[axis] += speed * dt;
                    else if (a.type === 'move_pingpong') {
                        const dist = a.distance || 5;
                        m.position[axis] = item.initPos[axis] + Math.sin(time * speed + item.offset) * dist;
                    }
                    else if (a.type === 'move_loop') {
                        const dist = a.distance || 20;
                        m.position[axis] = item.initPos[axis] + ((time * speed + item.offset * dist) % (dist * 2)) - dist;
                    }
                });

                const isInVR = xrHelper && xrHelper.baseExperience && xrHelper.baseExperience.state === BABYLON.WebXRState.IN_XR;

                // スマホ用UIでの移動処理
                if(moveState && camera && !isInVR) {
                    const forward = camera.getDirection(BABYLON.Vector3.Forward());
                    const right = camera.getDirection(BABYLON.Vector3.Right());
                    const up = new BABYLON.Vector3(0, 1, 0); // 上下移動用ベクトル
                    
                    forward.y = 0; right.y = 0; 
                    if (forward.lengthSquared() > 0.001) forward.normalize();
                    else forward.copyFromFloats(0, 0, 1);
                    
                    if (right.lengthSquared() > 0.001) right.normalize();
                    else right.copyFromFloats(1, 0, 0);

                    if(moveState === 'w') camera.position.addInPlace(forward.scale(MOVE_SPEED));
                    if(moveState === 's') camera.position.subtractInPlace(forward.scale(MOVE_SPEED));
                    if(moveState === 'd') camera.position.addInPlace(right.scale(MOVE_SPEED));
                    if(moveState === 'a') camera.position.subtractInPlace(right.scale(MOVE_SPEED));
                    // 🌟 復活: 上下ボタンの処理
                    if(moveState === 'up') camera.position.addInPlace(up.scale(MOVE_SPEED));
                    if(moveState === 'down') camera.position.subtractInPlace(up.scale(MOVE_SPEED));
                }
            });

            return scene;
        }

        // ---------------------------------------------------------
        // 2. 高度なJSON（アニメーション対応版）の構築エンジン
        // ---------------------------------------------------------
        const getMaterial = (item, scene) => {
            const mat = new BABYLON.StandardMaterial("mat_" + Math.random(), scene);
            if (item.color) mat.diffuseColor = BABYLON.Color3.FromHexString(item.color.substring(0,7));
            if (item.emissiveColor) mat.emissiveColor = BABYLON.Color3.FromHexString(item.emissiveColor.substring(0,7));
            if (item.alpha !== undefined) { mat.alpha = item.alpha; mat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND; }
            return mat;
        };

        const createMeshFromItem = (item, name, scene) => {
            let mesh; const opts = item.options || {};
            switch(item.type) {
                case "box": mesh = BABYLON.MeshBuilder.CreateBox(name, opts, scene); break;
                case "sphere": mesh = BABYLON.MeshBuilder.CreateSphere(name, opts, scene); break;
                case "cylinder": mesh = BABYLON.MeshBuilder.CreateCylinder(name, opts, scene); break;
                case "cone": opts.diameterTop = 0; opts.diameterBottom = opts.diameter || 1; mesh = BABYLON.MeshBuilder.CreateCylinder(name, opts, scene); break;
                default: mesh = BABYLON.MeshBuilder.CreateBox(name, {size: 1}, scene);
            }
            if (item.position) mesh.position = new BABYLON.Vector3(item.position[0], item.position[1], item.position[2]);
            mesh.material = getMaterial(item, scene);
            mesh.checkCollisions = true; 
            return mesh;
        };

        function applyAdvancedWorldData(env, sub) {
            activeMeshes.forEach(m => m.dispose());
            activeLights.forEach(l => l.dispose());
            activeTemplates.forEach(t => t.dispose());
            activeMeshes = []; activeLights = []; activeTemplates = []; currentAnimatables = [];

            if (env.clearColor) {
                currentScene.clearColor = BABYLON.Color4.FromHexString(env.clearColor.padEnd(9, 'F'));
            }
            if (env.lights) {
                env.lights.forEach((l, i) => {
                    const dir = l.dir || [0, 1, 0];
                    if (l.type === "hemispheric") {
                        const light = new BABYLON.HemisphericLight("l"+i, new BABYLON.Vector3(dir[0], dir[1], dir[2]), currentScene);
                        light.intensity = l.intensity || 1;
                        if(l.diffuse) light.diffuse = BABYLON.Color3.FromHexString(l.diffuse.substring(0,7));
                        if(l.groundColor) light.groundColor = BABYLON.Color3.FromHexString(l.groundColor.substring(0,7));
                        activeLights.push(light);
                    } else if (l.type === "directional") {
                        const light = new BABYLON.DirectionalLight("dl"+i, new BABYLON.Vector3(dir[0], dir[1], dir[2]), currentScene);
                        light.intensity = l.intensity || 0.8;
                        activeLights.push(light);
                    }
                });
            }
            if (env.ground) {
                const ground = createMeshFromItem(env.ground, "env-ground", currentScene);
                activeMeshes.push(ground);
            }

            if (sub.templates && sub.instances) {
                const templatesMap = {};
                sub.templates.forEach(t => {
                    const m = createMeshFromItem(t, "tpl_" + t.id, currentScene);
                    m.isVisible = false; 
                    templatesMap[t.id] = m;
                    activeTemplates.push(m);
                });
                
                sub.instances.forEach((inst, i) => {
                    const tpl = templatesMap[inst.templateId];
                    if (!tpl) return;

                    if (inst.positions) {
                        inst.positions.forEach((pos, j) => {
                            const newInst = tpl.createInstance("inst_" + i + "_" + j);
                            newInst.position = new BABYLON.Vector3(pos[0], pos[1], pos[2]);
                            newInst.checkCollisions = true;
                            if(inst.animation) currentAnimatables.push({ mesh: newInst, anim: inst.animation, initPos: newInst.position.clone(), offset: 0 });
                            activeMeshes.push(newInst);
                        });
                    }

                    if (inst.scatter) {
                        const s = inst.scatter, count = s.count || 10, rx = s.rangeX || [-10, 10], rz = s.rangeZ || [-10, 10], by = s.baseY || 0, scaleR = s.randomScale || [1, 1];
                        for (let k = 0; k < count; k++) {
                            const newInst = tpl.createInstance("scat_" + i + "_" + k);
                            newInst.position = new BABYLON.Vector3(Math.random()*(rx[1]-rx[0])+rx[0], by, Math.random()*(rz[1]-rz[0])+rz[0]);
                            newInst.rotation.y = Math.random() * Math.PI * 2;
                            const sc = Math.random() * (scaleR[1] - scaleR[0]) + scaleR[0];
                            newInst.scaling = new BABYLON.Vector3(sc, sc, sc);
                            newInst.checkCollisions = true;
                            
                            if(inst.animation) currentAnimatables.push({ mesh: newInst, anim: inst.animation, initPos: newInst.position.clone(), offset: Math.random() * Math.PI * 2 });
                            activeMeshes.push(newInst);
                        }
                    }
                });
            }
            
            const isInVR = xrHelper && xrHelper.baseExperience && xrHelper.baseExperience.state === BABYLON.WebXRState.IN_XR;
            if (!isInVR) {
                camera.position = new BABYLON.Vector3(0, 5, -20);
                camera.setTarget(new BABYLON.Vector3(0, 5, 0));
            }
        }

        // ---------------------------------------------------------
        // 3. 通信・UI制御ロジック
        // ---------------------------------------------------------
        async function fetchPlaylist() {
            document.getElementById("loading-text").innerText = "リストを取得中...";
            const res = await fetch(`${GAS_API_URL}?action=list`);
            return await res.json();
        }

        async function loadWorld(index) {
            if (playlist.length === 0) return;
            if (index < 0) index = playlist.length - 1;
            if (index >= playlist.length) index = 0;
            
            currentIndex = index;
            document.getElementById("filename-display").innerText = `World: ${playlist[currentIndex].name}`;
            document.getElementById("loading").classList.add("active");

            try {
                const res = await fetch(`${GAS_API_URL}?action=get&id=${playlist[currentIndex].id}`);
                const htmlText = await res.text();
                const doc = new DOMParser().parseFromString(htmlText, "text/html");
                
                const envTag = doc.getElementById("env-data");
                const subTag = doc.getElementById("sub-data");

                if (envTag) {
                    const envData = JSON.parse(envTag.textContent);
                    const subData = subTag ? JSON.parse(subTag.textContent) : {};
                    applyAdvancedWorldData(envData, subData);
                } else {
                    document.getElementById("filename-display").innerText = `[非対応形式] ${playlist[currentIndex].name}`;
                }
            } catch (e) {
                console.error("Load error:", e);
                document.getElementById("filename-display").innerText = "読込エラーが発生しました";
            } finally {
                document.getElementById("loading").classList.remove("active");
                resetAutoSwitch(); // ロード完了後にタイマーをリセット
            }
        }

        function prevWorld() { loadWorld(currentIndex - 1); }
        function nextWorld() { loadWorld(currentIndex + 1); }
        
        // 移動ボタン関連
        function startMove(dir) { moveState = dir; }
        function stopMove() { moveState = null; }

        // モーダル・UI関連 (🌟 復活)
        function toggleSettings() { 
            document.getElementById("settings-modal").classList.toggle("active"); 
        }
        function toggleMoveUI() {
            const show = document.getElementById("toggle-move-ui").checked;
            document.getElementById("move-ui").style.display = show ? "grid" : "none";
            document.getElementById("move-ui-updown").style.display = show ? "flex" : "none";
        }
        function toggleFilename() {
            const show = document.getElementById("toggle-filename").checked;
            document.getElementById("filename-display").style.display = show ? "block" : "none";
        }
        
        // 自動切替関連 (🌟 復活)
        function updateAutoSwitch() { resetAutoSwitch(); }
        function resetAutoSwitch() {
            if(autoSwitchTimer) clearInterval(autoSwitchTimer);
            const interval = parseInt(document.getElementById("auto-switch").value, 10);
            if(interval > 0) autoSwitchTimer = setInterval(() => { nextWorld(); }, interval);
        }

        // 起動処理
        createBaseScene().then(scene => {
            currentScene = scene;
            engine.runRenderLoop(() => { scene.render(); });
            
            document.getElementById("loading").classList.add("active");
            fetchPlaylist().then(list => {
                playlist = list;
                if(playlist.length > 0) loadWorld(0);
                else {
                    document.getElementById("loading").classList.remove("active");
                    document.getElementById("filename-display").innerText = "ファイルが見つかりません";
                }
            }).catch(e => {
                console.error("API通信エラー", e);
                document.getElementById("loading-text").innerText = "通信に失敗しました。URL等を確認してください。";
            });
        });

        // 画面リサイズ対応
        window.addEventListener("resize", () => { engine.resize(); });
    </script>
</body>
</html>
